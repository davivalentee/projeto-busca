<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaçaBook — Motor de Busca Científica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C4472A'/%3E%3Cg transform='translate(5,4)'%3E%3Crect x='2' y='0' width='14' height='18' rx='1.5' fill='%23F7F4EF'/%3E%3Crect x='0' y='1' width='3' height='16' rx='1' fill='%23E8B84B'/%3E%3Crect x='4' y='4' width='8' height='1.2' rx='0.6' fill='%23C4472A' opacity='0.5'/%3E%3Crect x='4' y='7' width='6' height='1.2' rx='0.6' fill='%23C4472A' opacity='0.5'/%3E%3Crect x='4' y='10' width='7' height='1.2' rx='0.6' fill='%23C4472A' opacity='0.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ── Variables ── */
  :root {
    --bg: #F7F4EF;
    --surface: #FFFFFF;
    --surface2: #EDE9E1;
    --ink: #1A1714;
    --ink2: #5C554C;
    --ink3: #9C9189;
    --accent: #C4472A;
    --accent2: #E8B84B;
    --border: #D9D3C8;
    --card-shadow: 0 2px 16px rgba(26,23,20,0.08);
    --radius: 4px;
    --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  [data-theme="dark"] {
    --bg: #0F0D0C;
    --surface: #1A1714;
    --surface2: #231F1B;
    --ink: #F0EBE3;
    --ink2: #B8AFA4;
    --ink3: #6E6560;
    --accent: #E0624A;
    --accent2: #E8B84B;
    --border: #2E2923;
    --card-shadow: 0 2px 24px rgba(0,0,0,0.4);
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(20px, 5vw, 80px);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background var(--transition);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .logo-mark {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
  }
  .logo-mark span { color: var(--accent); }
  .logo-sub {
    font-size: 11px;
    font-weight: 300;
    color: var(--ink3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink2);
    border-radius: 20px;
    padding: 6px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Search bar ── */
  .search-bar {
    padding: 16px 0;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 240px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink3);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: all var(--transition);
  }
  .search-input::placeholder { color: var(--ink3); }
  .search-input:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(196,71,42,0.1);
  }
  .filter-select {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    outline: none;
    transition: all var(--transition);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%239C9189' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 32px;
  }
  .filter-select:focus { border-color: var(--accent); }
  .btn-search {
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .btn-search:hover {
    background: #a83720;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(196,71,42,0.3);
  }
  .btn-search:active { transform: translateY(0); }

  /* ── Main layout ── */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(24px, 4vw, 48px) clamp(20px, 5vw, 80px);
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .stats-text {
    font-size: 13px;
    color: var(--ink3);
    font-weight: 300;
  }
  .stats-text strong { color: var(--ink2); font-weight: 500; }
  .page-badge {
    font-size: 12px;
    color: var(--ink3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
  }

  /* ── Loader ── */
  .loader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 64px 0;
  }
  .loader-wrap.hidden { display: none; }
  .loader-ring {
    width: 40px;
    height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loader-text {
    font-size: 13px;
    color: var(--ink3);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 300;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 24px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all var(--transition);
    display: flex;
    flex-direction: column;
    cursor: default;
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(2) { animation-delay: 0.04s; }
  .card:nth-child(3) { animation-delay: 0.08s; }
  .card:nth-child(4) { animation-delay: 0.12s; }
  .card:nth-child(5) { animation-delay: 0.16s; }
  .card:nth-child(6) { animation-delay: 0.20s; }
  .card:hover {
    border-color: var(--accent);
    box-shadow: var(--card-shadow);
    transform: translateY(-3px);
  }
  .card-cover {
    height: 180px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .card-cover img {
    height: 100%;
    width: 100%;
    object-fit: cover;
    transition: transform var(--transition);
  }
  .card:hover .card-cover img { transform: scale(1.04); }
  .card-cover-placeholder {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    color: var(--border);
  }
  .card-body {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-author {
    font-size: 12px;
    color: var(--ink3);
    font-weight: 300;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-pages {
    font-size: 11px;
    color: var(--ink3);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .card-footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }
  .btn-open {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    padding: 6px;
    border-radius: var(--radius);
    transition: all var(--transition);
    letter-spacing: 0.2px;
  }
  .btn-open:hover { background: var(--accent); color: #fff; }
  .btn-fav {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
    border-radius: var(--radius);
    transition: transform 0.2s;
    color: var(--ink3);
  }
  .btn-fav:hover { transform: scale(1.3); color: var(--accent2); }

  /* ── Empty state ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 20px;
  }
  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 16px;
    display: block;
  }
  .empty-state h3 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--ink2);
    margin-bottom: 8px;
  }
  .empty-state p { font-size: 14px; color: var(--ink3); }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }
  .btn-page {
    padding: 8px 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink2);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-page:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-page:disabled { opacity: 0.35; cursor: default; }
  .page-info {
    font-size: 13px;
    color: var(--ink3);
    font-weight: 300;
    min-width: 80px;
    text-align: center;
  }

  /* ── Section title ── */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 48px 0 20px;
  }
  .section-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .section-header .section-rule {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-count {
    font-size: 12px;
    color: var(--ink3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
  }

  /* ── Fav card (compact) ── */
  .fav-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    gap: 12px;
    padding: 14px;
    align-items: flex-start;
    transition: all var(--transition);
    animation: fadeUp 0.35s ease both;
  }
  .fav-card:hover {
    border-color: var(--accent2);
    box-shadow: 0 2px 12px rgba(232,184,75,0.12);
  }
  .fav-thumb {
    width: 44px;
    height: 60px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface2);
  }
  .fav-info { flex: 1; min-width: 0; }
  .fav-title {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .fav-author { font-size: 11px; color: var(--ink3); }
  .fav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .btn-remove-fav {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    color: var(--ink3);
    transition: color 0.2s;
    flex-shrink: 0;
  }
  .btn-remove-fav:hover { color: var(--accent); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    animation: toastIn 0.3s ease;
    pointer-events: none;
  }
  .toast.out { animation: toastOut 0.3s ease forwards; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(10px); }
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 32px 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--ink3);
    font-weight: 300;
    letter-spacing: 0.5px;
  }
  footer span { color: var(--accent); }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .logo-sub { display: none; }
    .search-bar { flex-direction: column; }
    .btn-search, .search-wrap { width: 100%; }
    .filter-select { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">
      <span class="logo-mark">Caça<span>Book</span></span>
      <span class="logo-sub">Motor de Busca Científica</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" onclick="toggleDarkMode()" id="themeBtn">
        🌙 Modo Escuro
      </button>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título, autor ou tema..." onkeydown="if(event.key==='Enter') buscarLivros()">
    </div>
    <select id="languageFilter" class="filter-select">
      <option value="">Todos idiomas</option>
      <option value="pt">Português</option>
      <option value="en">Inglês</option>
      <option value="es">Espanhol</option>
    </select>
    <select id="sortPages" class="filter-select">
      <option value="">Ordenar por</option>
      <option value="asc">Menos páginas</option>
      <option value="desc">Mais páginas</option>
    </select>
    <button class="btn-search" onclick="buscarLivros()">Buscar</button>
  </div>
</header>

<main>
  <!-- Loader -->
  <div class="loader-wrap hidden" id="loader">
    <div class="loader-ring"></div>
    <span class="loader-text">Consultando acervo…</span>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar" style="display:none">
    <span class="stats-text" id="totalPages"></span>
    <span class="page-badge" id="pageInfo"></span>
  </div>

  <!-- Results -->
  <div id="results" class="grid"></div>

  <!-- Pagination -->
  <div class="pagination" id="paginationArea" style="display:none">
    <button class="btn-page" id="btnPrev" onclick="prevPage()">← Anterior</button>
    <span class="page-info" id="pageInfo2"></span>
    <button class="btn-page" id="btnNext" onclick="nextPage()">Próximo →</button>
  </div>

  <!-- Favorites -->
  <div id="favSection">
    <div class="section-header">
      <h2>Favoritos</h2>
      <div class="section-rule"></div>
      <span class="section-count" id="favCount">0</span>
    </div>
    <div id="favorites" class="fav-grid"></div>
  </div>
</main>

<footer>
  Powered by <span>Google Books API</span> · CaçaBook © 2025
</footer>

<script>
const API_KEY = "AIzaSyAKimv55iGPsqPs2UFhwxDWi85G9UmghSU"
let currentPage = 0
const maxResults = 10
let lastSearch = ""
let isDark = false

// ── Theme ──
function toggleDarkMode() {
  isDark = !isDark
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro'
}

// ── Toast ──
function showToast(msg) {
  const t = document.createElement('div')
  t.className = 'toast'
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => {
    t.classList.add('out')
    setTimeout(() => t.remove(), 300)
  }, 2200)
}

// ── Loader ──
function toggleLoader(show) {
  document.getElementById('loader').classList.toggle('hidden', !show)
}

// ── Search ──
async function buscarLivros() {
  const query = document.getElementById('searchInput').value.trim()
  if (!query) { showToast('Digite um tema para buscar'); return }
  currentPage = 0
  lastSearch = query
  carregarLivros()
}

async function carregarLivros() {
  const lang = document.getElementById('languageFilter').value
  const startIndex = currentPage * maxResults
  let url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(lastSearch)}&startIndex=${startIndex}&maxResults=${maxResults}&key=${API_KEY}`
  if (lang) url += `&langRestrict=${lang}`

  try {
    toggleLoader(true)
    document.getElementById('results').innerHTML = ''
    document.getElementById('statsBar').style.display = 'none'
    document.getElementById('paginationArea').style.display = 'none'

    const res = await fetch(url)
    if (!res.ok) throw new Error('Erro na API')
    const data = await res.json()
    toggleLoader(false)

    if (!data.items) {
      document.getElementById('results').innerHTML = `
        <div class="empty-state">
          <span class="empty-state-icon">🔍</span>
          <h3>Nenhum resultado encontrado</h3>
          <p>Tente outro termo ou remova os filtros</p>
        </div>`
      return
    }
    mostrarLivros(data.items)
  } catch(e) {
    toggleLoader(false)
    document.getElementById('results').innerHTML = `
      <div class="empty-state">
        <span class="empty-state-icon">⚠️</span>
        <h3>Erro ao buscar dados</h3>
        <p>Verifique sua conexão e tente novamente</p>
      </div>`
    console.error(e)
  }
}

function mostrarLivros(livros) {
  const container = document.getElementById('results')
  container.innerHTML = ''
  let totalPages = 0
  const sort = document.getElementById('sortPages').value

  if (sort === 'asc') livros.sort((a,b) => (a.volumeInfo.pageCount||0) - (b.volumeInfo.pageCount||0))
  if (sort === 'desc') livros.sort((a,b) => (b.volumeInfo.pageCount||0) - (a.volumeInfo.pageCount||0))

  livros.forEach((livro, i) => {
    const info = livro.volumeInfo
    const paginas = info.pageCount || 0
    if (paginas) totalPages += paginas

    const thumb = info.imageLinks?.thumbnail || ''
    const author = Array.isArray(info.authors) ? info.authors.join(', ') : (info.authors || 'Autor desconhecido')

    const card = document.createElement('div')
    card.className = 'card'
    card.style.animationDelay = `${i * 0.04}s`
    card.innerHTML = `
      <div class="card-cover">
        ${thumb
          ? `<img src="${thumb}" alt="${info.title}" loading="lazy">`
          : `<span class="card-cover-placeholder">📖</span>`}
      </div>
      <div class="card-body">
        <div class="card-title">${info.title}</div>
        <div class="card-author">${author}</div>
        <div class="card-pages">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          ${paginas > 0 ? paginas + ' páginas' : 'Páginas não informadas'}
        </div>
      </div>
      <div class="card-footer">
        <a class="btn-open" href="${info.previewLink}" target="_blank" rel="noopener">Abrir no Google Books</a>
        <button class="btn-fav" title="Adicionar aos favoritos" onclick='salvarFavorito(${JSON.stringify(info)})'>★</button>
      </div>`
    container.appendChild(card)
  })

  // Stats
  document.getElementById('statsBar').style.display = 'flex'
  document.getElementById('totalPages').innerHTML =
    `<strong>${totalPages.toLocaleString()}</strong> páginas totais encontradas · busca por <strong>"${lastSearch}"</strong>`
  document.getElementById('pageInfo').textContent = `Página ${currentPage + 1}`

  // Pagination
  document.getElementById('paginationArea').style.display = 'flex'
  document.getElementById('pageInfo2').textContent = `Página ${currentPage + 1}`
  document.getElementById('btnPrev').disabled = currentPage === 0
}

function nextPage() { currentPage++; carregarLivros() }
function prevPage() { if (currentPage > 0) { currentPage--; carregarLivros() } }

// ── Favoritos ──
function salvarFavorito(livro) {
  let favoritos = JSON.parse(localStorage.getItem('favoritos')) || []
  if (favoritos.some(f => f.title === livro.title)) {
    showToast('Já está nos favoritos')
    return
  }
  favoritos.push(livro)
  localStorage.setItem('favoritos', JSON.stringify(favoritos))
  showToast('★ Adicionado aos favoritos')
  mostrarFavoritos()
}

function removerFavorito(titulo) {
  let favoritos = JSON.parse(localStorage.getItem('favoritos')) || []
  favoritos = favoritos.filter(f => f.title !== titulo)
  localStorage.setItem('favoritos', JSON.stringify(favoritos))
  mostrarFavoritos()
  showToast('Removido dos favoritos')
}

function mostrarFavoritos() {
  const favoritos = JSON.parse(localStorage.getItem('favoritos')) || []
  const container = document.getElementById('favorites')
  document.getElementById('favCount').textContent = favoritos.length
  container.innerHTML = ''

  if (favoritos.length === 0) {
    container.innerHTML = `<p style="font-size:13px;color:var(--ink3);font-weight:300;">Nenhum favorito ainda. Clique em ★ nos resultados para salvar.</p>`
    return
  }

  favoritos.forEach((livro, i) => {
    const thumb = livro.imageLinks?.thumbnail || ''
    const author = Array.isArray(livro.authors) ? livro.authors.join(', ') : (livro.authors || 'Autor desconhecido')
    const card = document.createElement('div')
    card.className = 'fav-card'
    card.style.animationDelay = `${i * 0.05}s`
    card.innerHTML = `
      ${thumb ? `<img class="fav-thumb" src="${thumb}" alt="${livro.title}" loading="lazy">` : '<div class="fav-thumb" style="display:flex;align-items:center;justify-content:center;font-size:20px;">📖</div>'}
      <div class="fav-info">
        <div class="fav-title">${livro.title}</div>
        <div class="fav-author">${author}</div>
      </div>
      <button class="btn-remove-fav" title="Remover" onclick="removerFavorito('${livro.title.replace(/'/g,"\\'")}')">✕</button>`
    container.appendChild(card)
  })
}

// Init
mostrarFavoritos()
</script>
</body>
</html>
